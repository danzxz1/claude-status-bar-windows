[package]
name = "claude-status-bar-windows"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Native Windows tray monitor for Claude Code and Codex"
license = "MIT"
repository = "https://github.com/danzxz1/claude-status-bar-windows"

[[bin]]
name = "ClaudeWindowsStatusBar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
